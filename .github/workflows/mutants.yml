name: Mutation Testing

# Mutation testing checks that the tests actually catch bugs: cargo-mutants
# makes small edits to the code (replacing a return value, flipping a
# comparison) and fails if the test suite still passes. Configuration lives in
# `.cargo/mutants.toml`.

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Only mutate code this PR touches, so the job stays fast.
  incremental:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Diff against base branch
        run: git diff origin/${{ github.base_ref }}...HEAD > pr.diff

      - name: Mutate changed code
        run: cargo mutants --no-shuffle -vV --in-diff pr.diff

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-incremental
          path: mutants.out

  # Whole codebase, split across shards.
  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Mutate shard ${{ matrix.shard }}/4
        run: cargo mutants --no-shuffle -vV --shard ${{ matrix.shard }}/4

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
