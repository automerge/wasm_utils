name: Code Quality Checks

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-matrix:
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install pinned Rust toolchain (rust-toolchain.toml)
      run: rustup toolchain install

    - name: Build workspace
      run: cargo build --workspace --verbose

    - name: Build workspace (all features)
      run: cargo build --workspace --all-features --verbose

    - name: Check workspace
      run: cargo check --workspace --all-features --verbose

    - name: Install Nightly Toolchain
      run: rustup toolchain install nightly --component rustfmt

    - name: Formatting
      run: cargo +nightly fmt --all -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Documentation
      env:
        RUSTDOCFLAGS: "-D warnings"
      run: cargo doc --workspace --no-deps

    # Workspace builds merge dependency features across members, which can
    # hide a crate's missing feature (e.g. syn/full). Build each published
    # crate on its own, with and without default features. All four crates
    # are `no_std` without the `std` feature (the macro crates still link
    # `proc_macro`, so for them this mainly guards against `std`-only code).
    - name: Check each crate standalone
      run: |
        for crate in from_js_ref wasm_bindgen_error wasm_bindgen_trait wasm_refgen; do
          cargo check -p "$crate"
          cargo check -p "$crate" --no-default-features
        done
