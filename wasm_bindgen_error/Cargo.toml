[package]
name = "wasm_bindgen_error"
version = "0.1.0"
description = "Derive macro to convert Rust error types into named JS errors via wasm-bindgen"
readme = "./README.md"
keywords = ["wasm", "wasm-bindgen", "error", "proc-macro"]
categories = ["wasm"]

authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
bolero = "0.11"

[lints]
workspace = true
